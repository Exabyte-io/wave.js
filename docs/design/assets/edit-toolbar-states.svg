<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff" stroke="#d0d7de" rx="10"/>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#24292f">Edit toolbar — states</text>

  <!-- Card A: no selection -->
  <text x="60" y="72" font-size="13" font-weight="600" fill="#57606a">A · No selection</text>
  <g>
    <rect x="60" y="84" width="180" height="330" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="76" y="98" width="34" height="34" rx="5" fill="#ddf4ff" stroke="#0969da"/>
    <text x="93" y="120" font-size="13" text-anchor="middle" fill="#0969da">✥</text>
    <rect x="76" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="93" y="164" font-size="14" text-anchor="middle" fill="#57606a">+</text>
    <rect x="112" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de" opacity="0.35"/>
    <text x="129" y="164" font-size="12" text-anchor="middle" fill="#57606a" opacity="0.35">🗑</text>
    <rect x="148" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de" opacity="0.35"/>
    <text x="165" y="164" font-size="13" text-anchor="middle" fill="#57606a" opacity="0.35">↺</text>
    <rect x="184" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de" opacity="0.35"/>
    <text x="201" y="164" font-size="13" text-anchor="middle" fill="#57606a" opacity="0.35">↻</text>
    <line x1="76" y1="194" x2="224" y2="194" stroke="#d0d7de"/>
    <text x="150" y="240" font-size="12" fill="#8b949e" text-anchor="middle" font-style="italic">no atom selected</text>
    <g opacity="0.4">
      <rect x="76" y="262" width="148" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="84" y="284" font-size="12" fill="#8b949e">X  —</text>
      <rect x="76" y="304" width="148" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="84" y="326" font-size="12" fill="#8b949e">Y  —</text>
      <rect x="76" y="346" width="148" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="84" y="368" font-size="12" fill="#8b949e">Z  —</text>
    </g>
  </g>

  <!-- Card B: selected -->
  <text x="300" y="72" font-size="13" font-weight="600" fill="#57606a">B · Atom selected</text>
  <g>
    <rect x="300" y="84" width="180" height="330" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="316" y="98" width="34" height="34" rx="5" fill="#ddf4ff" stroke="#0969da"/>
    <text x="333" y="120" font-size="13" text-anchor="middle" fill="#0969da">✥</text>
    <rect x="316" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="333" y="164" font-size="14" text-anchor="middle" fill="#57606a">+</text>
    <rect x="352" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="369" y="164" font-size="12" text-anchor="middle" fill="#57606a">🗑</text>
    <rect x="388" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="405" y="164" font-size="13" text-anchor="middle" fill="#57606a">↺</text>
    <rect x="424" y="142" width="34" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de" opacity="0.35"/>
    <text x="441" y="164" font-size="13" text-anchor="middle" fill="#57606a" opacity="0.35">↻</text>
    <line x1="316" y1="194" x2="464" y2="194" stroke="#d0d7de"/>
    <text x="316" y="218" font-size="13" font-weight="600" fill="#24292f">Si</text>
    <text x="316" y="236" font-size="11.5" fill="#57606a">crystal</text>
    <rect x="316" y="250" width="148" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="324" y="272" font-size="12" fill="#24292f">X  0.250</text>
    <rect x="316" y="292" width="148" height="34" rx="5" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="324" y="314" font-size="12" fill="#24292f">Y  0.3|</text>
    <rect x="316" y="334" width="148" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="324" y="356" font-size="12" fill="#24292f">Z  0.250</text>
  </g>

  <!-- Annotations -->
  <g font-size="12.5" fill="#24292f">
    <line x1="480" y1="115" x2="530" y2="115" stroke="#8b949e" stroke-dasharray="3,3"/>
    <text x="538" y="112" >Mode group: Translate only in v1 — Rotate returns with</text>
    <text x="538" y="128">group transforms (D4: rotating a sphere is a no-op).</text>

    <line x1="480" y1="160" x2="530" y2="160" stroke="#8b949e" stroke-dasharray="3,3"/>
    <text x="538" y="157">Remove / Undo / Redo enable-states follow selection and</text>
    <text x="538" y="173">history; Delete/Backspace and Ctrl/Cmd+Z(+Shift) mirror them.</text>

    <line x1="480" y1="228" x2="530" y2="228" stroke="#8b949e" stroke-dasharray="3,3"/>
    <text x="538" y="225">Units caption follows material.basis.units (“crystal” or</text>
    <text x="538" y="241">“cartesian, Å”) — never silently flips after an edit (D7).</text>

    <line x1="480" y1="309" x2="530" y2="309" stroke="#8b949e" stroke-dasharray="3,3"/>
    <text x="538" y="298">Fields hold a local draft while focused: clearable, minus sign</text>
    <text x="538" y="314">allowed, full precision kept. Commit on Enter/blur = exactly one</text>
    <text x="538" y="330">history entry + one onStructureModified (D18).</text>
  </g>

  <!-- Roadmap ghost row -->
  <g opacity="0.75">
    <rect x="538" y="360" width="330" height="54" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-dasharray="5,4"/>
    <rect x="552" y="372" width="52" height="30" rx="5" fill="#ffffff" stroke="#8b949e"/>
    <text x="578" y="392" font-size="12" text-anchor="middle" fill="#57606a">Si ▾</text>
    <rect x="612" y="372" width="34" height="30" rx="5" fill="#ffffff" stroke="#8b949e"/>
    <text x="629" y="392" font-size="12" text-anchor="middle" fill="#57606a">🧲</text>
    <text x="658" y="378" font-size="11" fill="#57606a">P2 roadmap: element picker</text>
    <text x="658" y="392" font-size="11" fill="#57606a">(fixes hardcoded Si, D22)</text>
    <text x="658" y="406" font-size="11" fill="#57606a">+ snap magnet toggle</text>
  </g>

  <text x="30" y="452" font-size="11" fill="#57606a">Trash, undo, redo render disabled at 35% opacity; the Tooltip wrapper keeps a &lt;span&gt; around disabled buttons (existing SquareIconButton behavior).</text>
</svg>
