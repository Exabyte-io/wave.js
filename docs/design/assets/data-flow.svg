<svg viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="fArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="fArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="680" fill="#ffffff" stroke="#d0d7de" rx="10"/>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#24292f">Data flow — current (v0) vs target (v1) edit commit</text>

  <!-- Host app -->
  <rect x="40" y="60" width="300" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="190" y="86" font-size="14" font-weight="600" fill="#24292f" text-anchor="middle">Host app (e.g. materials-designer)</text>
  <text x="190" y="108" font-size="11.5" fill="#57606a" text-anchor="middle">material prop in · onUpdate(material′) out</text>
  <text x="190" y="126" font-size="11.5" fill="#57606a" text-anchor="middle">host history records commits only</text>

  <!-- ThreeDEditor -->
  <rect x="40" y="216" width="300" height="110" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="190" y="242" font-size="14" font-weight="600" fill="#24292f" text-anchor="middle">ThreeDEditor (React)</text>
  <text x="190" y="264" font-size="11.5" fill="#57606a" text-anchor="middle">state.material · historyStack / pointer</text>
  <text x="190" y="282" font-size="11.5" fill="#57606a" text-anchor="middle">edit toolbar + coordinate panel</text>
  <text x="190" y="300" font-size="11.5" fill="#57606a" text-anchor="middle">identity-guarded reset on material prop (fixes D16)</text>

  <!-- WaveComponent -->
  <rect x="40" y="386" width="300" height="84" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="190" y="412" font-size="14" font-weight="600" fill="#24292f" text-anchor="middle">WaveComponent</text>
  <text x="190" y="434" font-size="11.5" fill="#57606a" text-anchor="middle">props → wave.setStructure / setCell / rebuildScene</text>
  <text x="190" y="452" font-size="11.5" fill="#57606a" text-anchor="middle">camera re-adjust gated by ε-tolerant cell compare (D1)</text>

  <!-- Wave + mixin -->
  <rect x="40" y="530" width="300" height="110" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="190" y="556" font-size="14" font-weight="600" fill="#24292f" text-anchor="middle">Wave + InteractiveStructureEditorMixin</text>
  <text x="190" y="578" font-size="11.5" fill="#57606a" text-anchor="middle">raycast selection · gizmo + free drag</text>
  <text x="190" y="596" font-size="11.5" fill="#57606a" text-anchor="middle">scene graph (atoms, bonds, cell, boundaries)</text>
  <text x="190" y="614" font-size="11.5" fill="#57606a" text-anchor="middle">onSelectionChanged · edit-delta events</text>

  <!-- Canvas events -->
  <rect x="620" y="556" width="320" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="780" y="582" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Canvas pointer + keyboard events</text>
  <text x="780" y="600" font-size="11.5" fill="#57606a" text-anchor="middle">pointerdown / move / up · Esc · Delete · Ctrl+Z</text>

  <!-- Current path -->
  <rect x="560" y="216" width="380" height="120" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="750" y="242" font-size="13.5" font-weight="600" fill="#cf222e" text-anchor="middle">CURRENT (v0): ThreeDSceneDataToMaterial(scene)</text>
  <text x="750" y="264" font-size="11.5" fill="#57606a" text-anchor="middle">re-derives lattice + basis from ALL scene meshes on every edit</text>
  <text x="750" y="282" font-size="11.5" fill="#57606a" text-anchor="middle">lossy lattice round-trip (D1) · phantom atoms from bonds/boundaries (D5)</text>
  <text x="750" y="300" font-size="11.5" fill="#57606a" text-anchor="middle">crash on non-periodic cells (D6) · strips metadata + units (D7)</text>
  <text x="750" y="318" font-size="11.5" fill="#57606a" text-anchor="middle">conventional-cell edits silently convert the material (D9)</text>

  <!-- Target path -->
  <rect x="560" y="386" width="380" height="104" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="750" y="412" font-size="13.5" font-weight="600" fill="#1a7f37" text-anchor="middle">TARGET (v1): apply known delta to known material</text>
  <text x="750" y="434" font-size="11.5" fill="#57606a" text-anchor="middle">“atom i moved to c” / “atom added” / “atom i removed”</text>
  <text x="750" y="452" font-size="11.5" fill="#57606a" text-anchor="middle">new Made.Material derived from the previous material —</text>
  <text x="750" y="470" font-size="11.5" fill="#57606a" text-anchor="middle">lattice, units, metadata, constraints all preserved by construction</text>

  <!-- Arrows -->
  <line x1="150" y1="156" x2="150" y2="214" stroke="#57606a" stroke-width="1.5" marker-end="url(#fArrow)"/>
  <text x="142" y="190" font-size="11" fill="#57606a" text-anchor="end">material prop</text>
  <line x1="230" y1="216" x2="230" y2="158" stroke="#57606a" stroke-width="1.5" marker-end="url(#fArrow)"/>
  <text x="238" y="190" font-size="11" fill="#57606a">onUpdate / session events</text>

  <line x1="150" y1="326" x2="150" y2="384" stroke="#57606a" stroke-width="1.5" marker-end="url(#fArrow)"/>
  <text x="142" y="358" font-size="11" fill="#57606a" text-anchor="end">material + cell props</text>
  <text x="238" y="350" font-size="11" fill="#57606a">bypassReloadViewer on</text>
  <text x="238" y="365" font-size="11" fill="#57606a">self-inflicted updates</text>

  <line x1="190" y1="470" x2="190" y2="528" stroke="#57606a" stroke-width="1.5" marker-end="url(#fArrow)"/>

  <line x1="618" y1="586" x2="342" y2="586" stroke="#57606a" stroke-width="1.5" marker-end="url(#fArrow)"/>

  <!-- wave -> current path -->
  <line x1="340" y1="546" x2="600" y2="338" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#fArrowRed)"/>
  <text x="500" y="456" font-size="11" fill="#cf222e" transform="rotate(-38 500 456)">scene → material (deprecated)</text>

  <!-- wave -> target path -->
  <line x1="340" y1="580" x2="558" y2="452" stroke="#1a7f37" stroke-width="2" marker-end="url(#fArrowGreen)"/>
  <text x="468" y="540" font-size="11" fill="#1a7f37" transform="rotate(-30 468 540)">edit delta</text>

  <!-- paths -> editor -->
  <path d="M 560 276 Q 420 276 346 268" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#fArrowRed)"/>
  <path d="M 560 428 Q 420 420 344 320" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#fArrowGreen)"/>
  <text x="410" y="252" font-size="11" fill="#cf222e">material′ (lossy)</text>
  <text x="400" y="398" font-size="11" fill="#1a7f37">material′ (exact)</text>

  <text x="30" y="662" font-size="11" fill="#57606a">The v1 delta path dissolves the D1/D5/D6/D7/D9 defect cluster by construction; ThreeDSceneDataToMaterial remains only for legacy scene-import use, not the edit loop.</text>
</svg>
