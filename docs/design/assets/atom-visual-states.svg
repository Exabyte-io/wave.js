<svg viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="atomG" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#f9e0b8"/>
      <stop offset="100%" stop-color="#c98d4b"/>
    </radialGradient>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="330" fill="#ffffff" stroke="#d0d7de" rx="10"/>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#24292f">Atom visual states (proposed affordances)</text>

  <!-- panels -->
  <g>
    <rect x="30" y="60" width="170" height="170" rx="8" fill="#202020"/>
    <rect x="216" y="60" width="170" height="170" rx="8" fill="#202020"/>
    <rect x="402" y="60" width="170" height="170" rx="8" fill="#202020"/>
    <rect x="588" y="60" width="170" height="170" rx="8" fill="#202020"/>
    <rect x="774" y="60" width="170" height="170" rx="8" fill="#202020"/>
  </g>

  <!-- 1 idle -->
  <circle cx="115" cy="145" r="32" fill="url(#atomG)"/>

  <!-- 2 hover -->
  <circle cx="301" cy="145" r="32" fill="url(#atomG)"/>
  <circle cx="301" cy="145" r="39" fill="none" stroke="#54aeff" stroke-width="3" opacity="0.85"/>
  <g transform="translate(340,90)" stroke="#ffffff" stroke-width="2">
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <line x1="-9" y1="0" x2="9" y2="0"/>
    <path d="M 0 -9 l -4 4 M 0 -9 l 4 4 M 0 9 l -4 -4 M 0 9 l 4 -4 M -9 0 l 4 -4 M -9 0 l 4 4 M 9 0 l -4 -4 M 9 0 l -4 4" fill="none"/>
  </g>

  <!-- 3 selected -->
  <circle cx="487" cy="145" r="32" fill="url(#atomG)"/>
  <circle cx="487" cy="145" r="40" fill="none" stroke="#0969da" stroke-width="3.5"/>
  <line x1="487" y1="145" x2="545" y2="145" stroke="#e5534b" stroke-width="2.5"/>
  <line x1="487" y1="145" x2="487" y2="87" stroke="#57ab5a" stroke-width="2.5"/>
  <line x1="487" y1="145" x2="449" y2="183" stroke="#539bf5" stroke-width="2.5"/>

  <!-- 4 dragging -->
  <circle cx="630" cy="170" r="32" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6,5"/>
  <circle cx="706" cy="115" r="32" fill="url(#atomG)" stroke="#0969da" stroke-width="3"/>
  <line x1="652" y1="152" x2="682" y2="132" stroke="#57606a" stroke-width="2" marker-end="url(#arrowS)"/>

  <!-- 5 esc revert -->
  <circle cx="838" cy="170" r="32" fill="url(#atomG)" stroke="#0969da" stroke-width="3"/>
  <circle cx="908" cy="112" r="24" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6,5"/>
  <path d="M 894 128 Q 862 150 866 158" fill="none" stroke="#cf222e" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- captions -->
  <g font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">
    <text x="115" y="256">Idle</text>
    <text x="301" y="256">Hover</text>
    <text x="487" y="256">Selected</text>
    <text x="673" y="256">Dragging</text>
    <text x="859" y="256">Esc → revert</text>
  </g>
  <g font-size="11.5" fill="#57606a" text-anchor="middle">
    <text x="115" y="274">plain sphere</text>
    <text x="301" y="274">ring + move cursor</text>
    <text x="487" y="274">stronger ring + gizmo</text>
    <text x="673" y="274">ghost marks origin</text>
    <text x="859" y="274">returns, no history entry</text>
  </g>

  <text x="30" y="310" font-size="11" fill="#57606a">Highlights use a dedicated channel (outline pass or overlay mesh) — not material.emissive, which spin glow and measurement hover already fight over (D19, R3).</text>
</svg>
