<svg viewBox="0 0 1000 690" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="canvasA"><rect x="40" y="90" width="420" height="440" rx="8"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="690" fill="#ffffff" stroke="#d0d7de" rx="10"/>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#24292f">Edit panel — split the tool strip from the selection inspector</text>
  <text x="30" y="58" font-size="12.5" fill="#57606a">Today one 84 px column carries eight icon buttons and four text fields, so it is ~600 px tall and clips in any viewer shorter than that, with no scroll.</text>

  <!-- ============ TODAY ============ -->
  <text x="40" y="80" font-size="12.5" font-weight="700" fill="#57606a">TODAY</text>
  <rect x="40" y="90" width="420" height="440" rx="8" fill="#202020"/>
  <g clip-path="url(#canvasA)">
    <rect x="338" y="104" width="106" height="480" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <!-- mode group -->
    <rect x="352" y="112" width="40" height="40" rx="5" fill="#ddf4ff" stroke="#0969da"/>
    <text x="372" y="137" font-size="13" text-anchor="middle" fill="#0969da">✥</text>
    <rect x="352" y="152" width="40" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="372" y="177" font-size="13" text-anchor="middle" fill="#b1b7bd">⟳</text>
    <!-- actions -->
    <rect x="352" y="200" width="40" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="372" y="225" font-size="14" text-anchor="middle" fill="#57606a">+</text>
    <rect x="352" y="240" width="40" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="372" y="265" font-size="12" text-anchor="middle" fill="#57606a">⧉</text>
    <rect x="352" y="280" width="40" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="372" y="305" font-size="12" text-anchor="middle" fill="#57606a">🗑</text>
    <!-- focus -->
    <rect x="352" y="328" width="40" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="372" y="353" font-size="12" text-anchor="middle" fill="#57606a">◎</text>
    <!-- undo / redo -->
    <rect x="352" y="376" width="40" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="372" y="401" font-size="13" text-anchor="middle" fill="#57606a">↺</text>
    <rect x="352" y="416" width="40" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="372" y="441" font-size="13" text-anchor="middle" fill="#57606a">↻</text>
    <!-- element + coordinates, cramped at 84 px -->
    <rect x="352" y="466" width="78" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="358" y="477" font-size="8" fill="#57606a">Element</text>
    <text x="358" y="490" font-size="11.5" fill="#24292f">Si</text>
    <text x="352" y="512" font-size="10" fill="#57606a">crystal</text>
    <rect x="352" y="520" width="78" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="358" y="531" font-size="8" fill="#57606a">X</text>
    <text x="358" y="544" font-size="11.5" fill="#24292f">-0.083</text>
  </g>
  <!-- clip marker -->
  <line x1="330" y1="530" x2="470" y2="530" stroke="#e5534b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="330" y="548" font-size="11.5" fill="#e5534b" font-weight="600">X clipped · Y and Z never reachable</text>

  <!-- ============ PROPOSED ============ -->
  <text x="540" y="80" font-size="12.5" font-weight="700" fill="#0969da">PROPOSED</text>
  <rect x="540" y="90" width="420" height="440" rx="8" fill="#202020"/>

  <!-- tools strip: icons only, one language with the left menu strip -->
  <g>
    <rect x="898" y="104" width="44" height="312" rx="6" fill="#2b2b2b"/>
    <rect x="904" y="112" width="32" height="32" rx="5" fill="#1f6feb" stroke="#54aeff"/>
    <text x="920" y="133" font-size="12" fill="#ffffff" text-anchor="middle">✥</text>
    <rect x="904" y="150" width="32" height="32" rx="5" fill="#333333" stroke="#454545"/>
    <text x="920" y="171" font-size="12" fill="#6e7681" text-anchor="middle">⟳</text>
    <line x1="906" y1="186" x2="934" y2="186" stroke="#454545"/>
    <rect x="904" y="188" width="32" height="32" rx="5" fill="#3a3a3a" stroke="#555"/>
    <text x="920" y="209" font-size="13" fill="#c9d1d9" text-anchor="middle">+</text>
    <rect x="904" y="226" width="32" height="32" rx="5" fill="#3a3a3a" stroke="#555"/>
    <text x="920" y="247" font-size="11" fill="#c9d1d9" text-anchor="middle">⧉</text>
    <rect x="904" y="264" width="32" height="32" rx="5" fill="#3a3a3a" stroke="#555"/>
    <text x="920" y="285" font-size="11" fill="#c9d1d9" text-anchor="middle">🗑</text>
    <line x1="906" y1="300" x2="934" y2="300" stroke="#454545"/>
    <rect x="904" y="302" width="32" height="32" rx="5" fill="#3a3a3a" stroke="#555"/>
    <text x="920" y="323" font-size="11" fill="#c9d1d9" text-anchor="middle">◎</text>
    <rect x="904" y="340" width="32" height="32" rx="5" fill="#3a3a3a" stroke="#555"/>
    <text x="920" y="361" font-size="12" fill="#c9d1d9" text-anchor="middle">↺</text>
    <rect x="904" y="378" width="32" height="32" rx="5" fill="#3a3a3a" stroke="#555"/>
    <text x="920" y="399" font-size="12" fill="#c9d1d9" text-anchor="middle">↻</text>
  </g>

  <!-- inspector card -->
  <g>
    <rect x="660" y="104" width="228" height="212" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="674" y="124" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.6">SELECTION</text>
    <circle cx="678" cy="148" r="8" fill="#f0c8a0"/>
    <rect x="694" y="136" width="52" height="24" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="700" y="153" font-size="12.5" font-weight="600" fill="#24292f">Si</text>
    <text x="756" y="153" font-size="11.5" fill="#57606a">site 12 · 4 bonds</text>
    <!-- units: display-only toggle -->
    <text x="674" y="182" font-size="10.5" fill="#57606a">Units</text>
    <rect x="712" y="170" width="58" height="20" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="741" y="184" font-size="10.5" fill="#0969da" text-anchor="middle">crystal</text>
    <rect x="770" y="170" width="66" height="20" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="803" y="184" font-size="10.5" fill="#57606a" text-anchor="middle">cartesian</text>
    <!-- coordinates, side by side with room for a sign and 3 decimals -->
    <rect x="674" y="200" width="66" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="680" y="211" font-size="8" fill="#57606a">X</text>
    <text x="680" y="226" font-size="12" fill="#24292f">-0.083</text>
    <rect x="748" y="200" width="66" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="754" y="211" font-size="8" fill="#57606a">Y</text>
    <text x="754" y="226" font-size="12" fill="#24292f">0.250</text>
    <rect x="822" y="200" width="52" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="828" y="211" font-size="8" fill="#57606a">Z</text>
    <text x="828" y="226" font-size="12" fill="#24292f">0.125</text>
    <line x1="674" y1="246" x2="874" y2="246" stroke="#eaeef2"/>
    <text x="674" y="266" font-size="11.5" fill="#57606a">Nearest: O 1.61 Å · O 1.62 Å</text>
    <!-- out-of-cell flag, decision D-7(c) -->
    <rect x="674" y="276" width="200" height="28" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="684" y="294" font-size="10.5" fill="#7d4e00">Outside the cell —</text>
    <text x="792" y="294" font-size="10.5" font-weight="700" fill="#0969da">Wrap in</text>
  </g>

  <!-- empty state -->
  <g>
    <rect x="660" y="328" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/>
    <text x="774" y="352" font-size="11.5" fill="#57606a" text-anchor="middle">Click an atom to select</text>
    <text x="774" y="370" font-size="10" fill="#8b949e" text-anchor="middle">Shift-click adds · drag empty space = marquee</text>
  </g>

  <!-- Callouts -->
  <g font-size="13" font-weight="700">
    <circle cx="962" cy="260" r="12" fill="#0969da"/><text x="962" y="265" fill="#fff" text-anchor="middle">1</text>
    <circle cx="638" cy="150" r="12" fill="#0969da"/><text x="638" y="155" fill="#fff" text-anchor="middle">2</text>
    <circle cx="638" cy="212" r="12" fill="#0969da"/><text x="638" y="217" fill="#fff" text-anchor="middle">3</text>
    <circle cx="638" cy="290" r="12" fill="#0969da"/><text x="638" y="295" fill="#fff" text-anchor="middle">4</text>
    <circle cx="638" cy="356" r="12" fill="#0969da"/><text x="638" y="361" fill="#fff" text-anchor="middle">5</text>
  </g>

  <!-- Legend -->
  <g font-size="12.5" fill="#24292f">
    <text x="30" y="580"><tspan font-weight="700">1</tspan>  <tspan font-weight="600">Tools stay icons.</tspan> Same visual language as the left menu strip — mode · add/clone/delete · focus/undo/redo, grouped by dividers. Rotate stays disabled below two atoms, as today.</text>
    <text x="30" y="604"><tspan font-weight="700">2</tspan>  <tspan font-weight="600">Data becomes a card.</tspan> Element, site index and bond count read as information, not as another button. Room for the fields to be legible.</text>
    <text x="30" y="628"><tspan font-weight="700">3</tspan>  <tspan font-weight="600">Units toggle is display-only</tspan> — it converts what is shown, never the material's own <tspan font-family="monospace" font-size="11.5">basis.units</tspan>. The caption stops being the only place units appear.</text>
    <text x="30" y="652"><tspan font-weight="700">4</tspan>  <tspan font-weight="600">Out-of-cell flag + one-click wrap</tspan> — the UI half of open decision D-7(c), which the spec recommends but nothing surfaces yet.</text>
    <text x="30" y="676"><tspan font-weight="700">5</tspan>  <tspan font-weight="600">Empty state</tspan> teaches the selection modifiers (Shift-click, marquee) that appear in no UI today. Currently the panel simply shows nothing.</text>
  </g>
</svg>
